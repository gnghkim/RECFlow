# 운영 전용. 로컬 개발은 docker-compose.yml 을 쓴다.
#
# ## 리버스 프록시는 이 스택이 소유하지 않는다
#
# 배포 대상 VPS에는 이미 공용 Caddy가 80/443을 점유하고 여러 사내 서비스를
# 프록시하고 있다. RECFlow가 자기 Caddy를 띄우면 포트가 충돌해 기존 서비스가
# 전부 끊긴다. 그래서 여기에는 Caddy 서비스가 없다.
#
# 대신 web 컨테이너를 공용 네트워크 `web`에 붙이고, 공용 Caddyfile
# (/opt/caddy/Caddyfile)에 사이트 블록을 한 줄 추가해 연결한다.
#
#     rec.<도메인> {
#         encode zstd gzip
#         reverse_proxy recflow-web:3000
#     }
#
# 공용 Caddy가 없는 곳에 배포한다면 별도로 Caddy를 띄우고 같은 방식으로
# recflow-web:3000 을 가리키면 된다.
#
# ## 네트워크가 둘로 갈린다
#
#   web      : Caddy가 web 컨테이너에 닿기 위한 공용 네트워크 (외부 생성)
#   internal : db 와 collector. RECFlow 전용이라 다른 서비스가 닿을 수 없다.
#
# 이 분리 덕분에 같은 서버의 다른 사내 서비스가 RECFlow의 DB에 접근하지 못한다.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: recflow-web:latest
    container_name: recflow-web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_PASSWORD: ${APP_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      COLLECTOR_INTERNAL_URL: ${COLLECTOR_INTERNAL_URL}
      TZ: ${TZ}
    # 호스트 포트를 열지 않는다. 공용 Caddy만 내부 네트워크로 접근한다.
    networks:
      - web
      - internal
    depends_on:
      db:
        condition: service_healthy

  collector:
    build:
      context: ./apps/collector
    image: recflow-collector:latest
    container_name: recflow-collector
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KPX_API_KEY: ${KPX_API_KEY}
      KPX_BASE_URL: ${KPX_BASE_URL}
      KPX_DAILY_BUDGET: ${KPX_DAILY_BUDGET}
      FIXTURE_DIR: /app/fixtures
      TZ: ${TZ}
    volumes:
      - collector_fixtures:/app/fixtures
      - collector_samples:/app/api-samples
    # 호스트 포트를 열지 않는다. 웹이 내부망으로만 호출한다.
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: recflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    # 운영에서는 호스트 포트를 절대 열지 않는다.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-backup:
    build:
      context: ./infra/backup
    image: recflow-backup:latest
    container_name: recflow-backup
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY}
      TZ: ${TZ}
    volumes:
      - ./infra/backup/dumps:/dumps
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  collector_fixtures:
  collector_samples:

networks:
  # 공용 리버스 프록시가 쓰는 네트워크. compose 밖에서 이미 만들어져 있다.
  web:
    name: web
    external: true
  internal:
    name: recflow-internal
